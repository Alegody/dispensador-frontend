worker_processes 1;

events { worker_connections 1024; }

http {
  upstream frontends {
    server front:80;
  }
  upstream apis {
    server api:3000;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://frontends;
    }
    location /api/ {
      proxy_pass http://apis;
    }
  }
}
